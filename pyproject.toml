[project]
name = "healthcard"
version = "0.1.0"
description = "MSME Financial Health Card — explainable alternative-data credit scoring for NTC/NTB MSMEs"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26,<2.3",
    "numba>=0.60",
    "pyarrow>=16.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "shap>=0.46",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",   # alembic and the migration lock need a sync driver
    "pypika>=0.48",
    "alembic>=1.14",
    "sqlalchemy>=2.0",
    "structlog>=24.4",
    "mlflow>=2.17",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
s3 = ["boto3>=1.35", "s3fs>=2024.10"]
# DVC is declared but not installed by default: it pulls a large dependency tree
# and is only needed to push or pull the tracked data, not to run the pipelines.
#   uv sync --extra data
data = ["dvc>=3.55", "dvc-s3>=3.2"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "tavern>=2.11",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "detect-secrets>=1.5",
    "types-pyyaml>=6.0",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B"]
ignore = ["B008"]  # FastAPI Depends() in defaults is the documented idiom

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
# S608 flags f-string SQL. In this package every interpolation is either a fixed
# CTE constant or a column name from a compile-time allowlist (FILTERABLE /
# _SUMMARY_COLUMNS); every *value* is passed as an asyncpg $n parameter, never
# interpolated. Reviewed per call site rather than silenced repo-wide.
"src/data_access/healthcards.py" = ["S608"]
"src/data_access/portfolio.py" = ["S608"]
"src/data/panel_reconstructor.py" = ["S311"]  # numpy RNG for synthetic panel, not crypto
"notebooks/**" = ["E402", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^alembic/", "^notebooks/"]
warn_unused_ignores = false

# Libraries that ship no type information. Listed explicitly rather than via a
# global ignore, so adding a new untyped dependency is a visible decision.
[[tool.mypy.overrides]]
module = [
    "shap.*",
    "lightgbm.*",
    "sklearn.*",
    "pypika.*",
    "mlflow.*",
    "matplotlib.*",
    "yaml.*",
    "asyncpg.*",
    "joblib.*",
    "psycopg2.*",
    "uvicorn.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-m 'not eval'"
markers = [
    "aws_credentials: needs real AWS / MLflow / Postgres credentials",
    "eval: heavy offline evaluation regression gate, opt-in only",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/evaluation/*", "*/__main__.py"]
