            - Monthly_Bank_Debits_INR
            - Average_Bank_Balance_INR
            - Monthly_Payroll_INR
            - Monthly_Loan_EMI_INR
          min_denominator: 1.0
        schema:
          id_column: MSME_ID
          categorical_columns:
          - Customer_Segment
          - Business_Type
          - Industry
          - Location_Category
          - GST_Return_Frequency
          - Has_Existing_Loan
          structural_null_columns:
            EMI_On_Time_Rate_Pct: Has_Existing_Loan == 'No'
          feature_columns:
          - Customer_Segment
          - Business_Type
          - Industry
          - Location_Category
          - Years_in_Operation
          - Employee_Count
          - Annual_Turnover_INR
          - Monthly_GST_Sales_INR
