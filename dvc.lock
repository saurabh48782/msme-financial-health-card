            max_leaves: 63
            max_depth: 0
            grow_policy: lossguide
            min_child_weight: 10
            subsample: 0.9
            colsample_bytree: 0.9
            reg_lambda: 1.0
            tree_method: hist
            enable_categorical: true
            importance_type: total_gain
            n_jobs: -1
            verbosity: 0
          eligibility_classifier:
            objective: binary:logistic
            n_estimators: 500
            learning_rate: 0.05
            max_leaves: 31
            max_depth: 0
            grow_policy: lossguide
