      hash: md5
      md5: 11eb0d2e8152a82d0b10b28fda29bfc9.dir
      size: 73757
      nfiles: 14
    params:
      params.yaml:
        preprocessing:
          winsorise:
            lower_quantile: 0.01
            upper_quantile: 0.99
            columns:
            - Annual_Turnover_INR
            - Monthly_GST_Sales_INR
            - Monthly_GST_Purchases_INR
            - Monthly_UPI_Inflow_INR
            - Monthly_UPI_Outflow_INR
            - UPI_Avg_Ticket_Size_INR
