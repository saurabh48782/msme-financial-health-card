              threshold: 0.95
              message: Bank debits persistently exceed credits
            thin_cash_buffer:
              severity: medium
              metric: balance_days_of_outflow
              operator: lt
              threshold: 3.0
              message: Cash buffer covers under 3 days of outflow
          contraction_rule:
            growth_below_pct: -10.0
            overdraft_above: 0.35
