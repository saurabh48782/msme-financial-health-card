name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LOG_TARGET: stdout
  LOG_LEVEL: WARNING

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Sync the environment
        run: uv sync --frozen --all-groups

      - name: Cache pre-commit hooks
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      # The same three scripts developers run, and the same three the container
      # test targets run. Dev, container and CI cannot diverge.
      - name: Lint, format, types, secrets
        run: bash scripts/precommit_check.sh

      - name: Unit tests
        run: bash scripts/unit_test.sh

      - name: Integration tests
        run: bash scripts/integration_test.sh

  image:
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: false
          tags: |
            healthcard:${{ github.sha }}
            healthcard:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
